MODEL:
  ENCODER:
    TYPE: fastitpnb
    STRIDE: 16
    PRETRAIN_TYPE: pretrained/itpn/fast_itpn_base_clipl_e1600.pt
    PATCHEMBED_INIT: halfcopy
    CLASS_TOKEN: True
  PROMPT:
    ENABLED: True
    DIM: 512
    LENGTH: 5
    MEMORY_SIZE: 50
    NUM_HEADS: 8
    HISTORY_LENGTH: 6
    SMOOTHING_WINDOW: 5
    WARMUP_EPOCHS: 75
DATA:
  MULTI_MODAL_LANGUAGE: False
  MULTI_MODAL_VISION: True
  MAX_SAMPLE_INTERVAL: 200
  SEARCH:
    SIZE: 224
    FACTOR: 4.0
    NUMBER: 1
    CENTER_JITTER: 3.5
    SCALE_JITTER: 0.5
  TEMPLATE:
    SIZE: 112
    FACTOR: 2.0
    NUMBER: 2
    CENTER_JITTER: 0
    SCALE_JITTER: 0
  TRAIN:
    SAMPLE_PER_EPOCH: 60000
  CONTINUAL:
    ENABLED: True
    EPOCHS_PER_TASK: 150
    DAY_DATASETS_NAME: [LASOT, GOT10K_vottrain, COCO17, TRACKINGNET]
    DAY_DATASETS_RATIO: [1, 1, 1, 1]
    NIGHT_DATASETS_NAME: [BDD100K_NIGHT, SHIFT_NIGHT]
    NIGHT_DATASETS_RATIO: [1, 1]
  NIGHT:
    BDD_ROOT: ''
    BDD_ANNOTATION: ''
    SHIFT_ROOT: ''
    SHIFT_ANNOTATION: ''
TRAIN:
  TYPE: normal
  BATCH_SIZE: 16
  # False: BATCH_SIZE per GPU. True: total batch size across GPUs.
  GLOBAL_BATCH_SIZE: False
  EPOCH: 300
  LR: 0.0001
  ENCODER_MULTIPLIER: 1.0
  LR_DROP_EPOCH: 100
  WEIGHT_DECAY: 0.0001
  TASK_CE_WEIGHT: 0.0
  NUM_WORKER: 8
  AMP: False
  RESUME: null
TEST:
  EPOCH: 300
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 224
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 112
  NUM_TEMPLATES: 2
  WINDOW: True
  UPDATE_INTERVALS:
    DEFAULT: 25
  UPDATE_THRESHOLD:
    DEFAULT: 0.70
  MULTI_MODAL_VISION:
    DEFAULT: True
  MULTI_MODAL_LANGUAGE:
    DEFAULT: False
  USE_NLP:
    DEFAULT: False
